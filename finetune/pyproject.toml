[tool.poetry]
name = "quote-ai"
version = "0.1.0"
description = "Fine-tuning GPT models for construction industry quotes"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
openai = "^1.59.9"
pandas = "^2.2.3"
numpy = "^2.2.2"
pdfplumber = "^0.11.5"
nltk = "^3.9.1"
python-dotenv = "^1.0.1"
scikit-learn = "^1.6.1"
tqdm = "^4.67.1"
loguru = "^0.7.3"
typer = "^0.15.1"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"
google-api-python-client = "^2.159.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
